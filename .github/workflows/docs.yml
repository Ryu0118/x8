name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**/*.docc/**'
      - 'Sources/**/*.swift'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/docs.yml'
      - 'scripts/render-diagrams.sh'
      - 'scripts/mermaid-docs.py'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocC
    runs-on: xcode-27
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          swift --version

      - name: Build documentation
        run: |
          CLANG_MODULE_CACHE_PATH=.build/module-cache \
          swift package --disable-sandbox \
            --cache-path .build/swiftpm-cache \
            --config-path .build/swiftpm-config \
            --security-path .build/swiftpm-security \
            --traits S3 \
            generate-documentation \
            --target X8CLI \
            --target X8Storage \
            --target X8Core \
            --target X8Config \
            --enable-experimental-combined-documentation \
            --disable-indexing \
            --transform-for-static-hosting \
            --hosting-base-path "/${REPOSITORY_NAME}" \
            --output-path .build/docs
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}

      - name: Render and embed Mermaid diagrams
        run: ./scripts/render-diagrams.sh .build/docs

      - name: Redirect site root to documentation
        run: |
          cat > .build/docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./documentation/">
              <link rel="canonical" href="./documentation/">
              <title>X8 Documentation</title>
            </head>
            <body>
              <p>Redirecting to the <a href="./documentation/">X8 documentation</a>.</p>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
